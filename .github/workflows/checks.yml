name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg for container timestamp regression
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Application checks
        run: python -m unittest discover -s tests -v
      - name: Training data guard checks (CPU only)
        run: python -m unittest discover -s training -p 'test_*.py' -v
      - name: Syntax
        run: |
          python -m compileall -q app.py cutroom training tests
          node --check static/app.js
          node --check static/estimate.js
          node --test tests/test_estimate.js tests/test_project_status.js
