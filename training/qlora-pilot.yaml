# EXAMPLE ONLY. Run from outputs/cutroom after licensed human examples,
# token checks, app GPU release, and the separate 4-iteration memory gate pass.
# MLX affine 4-bit QLoRA, not bitsandbytes NF4. Inference fit != training fit.
model: training/base-qwen3-14b-4bit
train: true
fine_tune_type: lora
data: training/prepared
seed: 37
optimizer: adam
num_layers: 4
batch_size: 1
grad_accumulation_steps: 4
# 160 microsteps = 40 optimizer updates with accumulation=4.
# A starting ceiling for a ~100-example pilot, not a quality promise.
iters: 160
learning_rate: 0.00001
max_seq_length: 2048
grad_checkpoint: true
mask_prompt: true
val_batches: -1
steps_per_report: 4
steps_per_eval: 20
save_every: 20
adapter_path: training/adapters/pilot
test: false
test_batches: -1
trust_remote_code: false
lora_parameters:
  keys: [self_attn.q_proj, self_attn.v_proj]
  rank: 4
  scale: 8.0
  dropout: 0.0
